<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Course — All Modules</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b1420; font-family:-apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #nav {
    position: sticky; top: 0; z-index: 1000;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:#0b1420; border-bottom:2px solid #d29922;
    padding:12px 16px;
  }
  #nav .brand { color:#8b949e; font-family:'IBM Plex Mono', Consolas, monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; margin-right:8px; }
  #nav button {
    background:#161b22; color:#c9d1d9; border:1px solid #30363d;
    padding:9px 16px; border-radius:6px; cursor:pointer;
    font-family:'IBM Plex Mono', Consolas, monospace; font-size:12.5px;
    white-space:nowrap; transition: background .15s, color .15s, border-color .15s;
  }
  #nav button:hover { background:#1f6feb; color:#fff; border-color:#1f6feb; }
  #nav button.active { background:#d29922; color:#1c1204; border-color:#d29922; font-weight:700; }
  .frame-wrap { position:relative; width:100%; height:calc(100vh - 58px); }
  iframe {
    position:absolute; top:0; left:0; width:100%; height:100%;
    border:0; display:none; background:#0d1117;
  }
  iframe.active { display:block; }
  @media (max-width: 800px) { #nav { overflow-x:auto; flex-wrap:nowrap; } }
</style>
</head>
<body>

<nav id="nav">
  <span class="brand">SQL Course</span>
  <button data-m="1" class="active">1 · Foundations</button>
  <button data-m="2">2 · Filtering &amp; Sorting</button>
  <button data-m="3">3 · Aggregation</button>
  <button data-m="4">4 · Joining Tables</button>
  <button data-m="5">5 · Subqueries &amp; CTEs</button>
  <button data-m="6">6 · Capstone</button>
</nav>

<div class="frame-wrap">
  <iframe id="frame1" class="active" title="Module 1: Foundations" src="module-1.html"></iframe>
  <iframe id="frame2" title="Module 2: Filtering & Sorting" src="module-2.html"></iframe>
  <iframe id="frame3" title="Module 3: Aggregation" src="module-3.html"></iframe>
  <iframe id="frame4" title="Module 4: Joining Tables" src="module-4.html"></iframe>
  <iframe id="frame5" title="Module 5: Subqueries & CTEs" src="module-5.html"></iframe>
  <iframe id="frame6" title="Module 6: Capstone Project" src="module-6.html"></iframe>
</div>

<script>
(function(){
  var buttons = document.querySelectorAll("#nav button");
  var frames = document.querySelectorAll("iframe");
  buttons.forEach(function(btn){
    btn.addEventListener("click", function(){
      var m = btn.dataset.m;
      buttons.forEach(function(b){ b.classList.toggle("active", b === btn); });
      frames.forEach(function(f){ f.classList.toggle("active", f.id === "frame" + m); });
    });
  });
})();
</script>

</body>
</html>
